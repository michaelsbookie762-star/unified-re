[project]
name = "unified-re"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["mcp==2.3.0", "onnxruntime==1.31.0", "numpy==2.5.4", "tokenizers==0.23.3", "jsonschema==4.26.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
